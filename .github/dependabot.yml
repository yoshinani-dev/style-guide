version: 2
updates:
  # npmの更新設定
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    versioning-strategy: "auto"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Commitlint関連
      commitlint-dependencies:
        patterns:
          - "@commitlint/*"
        update-types:
          - "minor"
          - "patch"
      # Oxc（oxfmt / oxlint）関連
      # @effect/tsgo は対応する oxlint / oxlint-tsgolint のバージョンが決まっているため、同じグループで更新する
      oxc-dependencies:
        patterns:
          - "oxfmt"
          - "oxlint"
          - "oxlint-*"
          - "@oxlint/*"
          - "@effect/tsgo"
          - "effect"
        update-types:
          - "minor"
          - "patch"
      # 開発依存関係
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # メジャーバージョンアップは手動で対応
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # peerDependenciesは慎重に扱う
      - dependency-name: "typescript"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actionsの更新設定
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
