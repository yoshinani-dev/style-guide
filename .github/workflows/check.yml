name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    if: |
      github.event.action == 'labeled' && github.event.label.name == 'run-ci' ||
      github.event.pull_request.user.login != 'github-actions[bot]'

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Run Format, Lint and Type Check
        run: pnpm run check

      - name: Validate shared tsconfigs (TypeScript 5)
        run: pnpm run test:tsconfig

      - name: Validate shared tsconfigs (TypeScript 6)
        run: pnpm --package=typescript@6 dlx node tests/tsconfig.ts

      - name: Validate shared tsconfigs (TypeScript 7)
        run: pnpm --package=typescript@7 dlx node tests/tsconfig.ts

      - name: Run Tests
        run: pnpm run test

      # vp pack が package.json の exports を生成するため、生成結果がコミットされているか確かめる
      - name: Check generated exports are committed
        run: git diff --exit-code package.json
